name: Publish NuGet Package

on:
  release:
    types:
      - published
  workflow_dispatch:

jobs:
  publish:
    runs-on: windows-latest
    permissions:
      id-token: write
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build and Pack
        shell: pwsh
        run: |
          $rawTag = "${{ github.event.release.tag_name }}"
          $version = if ($rawTag) { $rawTag.TrimStart('v') } else { '2.3.5' }
          dotnet build DesktopFences.csproj -c Release -p:PackageVersion=$version
        
      - name: Publish to NuGet
        run: Get-ChildItem "bin\Release\*.nupkg" | ForEach-Object { dotnet nuget push $_.FullName --source https://api.nuget.org/v3/index.json --api-key ${{ secrets.NUGET_API_KEY }} --skip-duplicate }
